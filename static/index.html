<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nauticards — Лекция в карточки для повторения за секунды</title>
<meta name="description" content="Загрузи файл лекции (txt, pdf, docx, pptx) или вставь текст — ИИ разложит материал на карточки для быстрого повторения перед экзаменом." />
<meta name="keywords" content="карточки для учёбы, конспект в карточки, ИИ для студентов, flashcards, подготовка к экзамену" />
<meta property="og:title" content="Nauticards — Лекция в карточки" />
<meta property="og:description" content="ИИ превращает текст лекции в карточки для повторения" />
<meta property="og:type" content="website" />
<link rel="stylesheet" href="/static/style.css?v=4" />
</head>
<body>

<header>
  <div class="eyebrow">Конспект → Карточка</div>
  <h1>Лекция за пару секунд<br>в набор <span>карточек</span></h1>
  <p>Загрузи файл лекции (.txt, .pdf, .docx, .pptx) или вставь текст — модель разложит его на карточки для повторения.</p>
</header>

<div class="panel">
  <div class="tabs">
    <button class="tab-btn active" data-tab="file">Файл</button>
    <button class="tab-btn" data-tab="text">Текст</button>
  </div>
  <div class="limit-hint" id="limitHint">До 15 000 символов текста или файл до 10 МБ</div>

  <div class="tab-content active" id="tab-file">
    <label class="file-drop" id="fileDrop" for="fileInput">
      <span class="drop-icon">📎</span>
      <span>Перетащи файл сюда или нажми, чтобы выбрать</span>
      <span style="font-size:11px; opacity:.7">.txt, .pdf, .docx, .pptx</span>
    </label>
    <input type="file" id="fileInput" accept=".txt,.md,.pdf,.docx,.pptx" style="display:none" />
  </div>

  <div class="tab-content" id="tab-text">
    <textarea id="textInput" placeholder="Вставь текст лекции сюда..."></textarea>
    <div class="char-counter" id="charCounter">0 символов</div>
  </div>

  <div class="level-toggle">
    <button class="level-btn" data-level="brief">Кратко</button>
    <button class="level-btn active" data-level="detailed">Подробно</button>
  </div>

  <button class="submit" id="submitBtn">
    <span class="spinner"></span>
    <span id="submitText">Превратить в карточки</span>
  </button>
</div>

<div class="status" id="status"></div>
<div class="share-box" id="shareBox" style="display:none">
  <div class="share-actions">
    <button class="share-btn" id="shareBtn">🔗 Поделиться ссылкой</button>
    <button class="download-btn" id="downloadBtn">⬇️ Скачать .txt</button>
  </div>
  <div class="share-link-row" id="shareLinkRow" style="display:none">
    <input type="text" id="shareLinkInput" readonly />
    <button id="copyLinkBtn">Копировать</button>
  </div>
</div>

<div id="cards"></div>
<p class="empty-hint" id="emptyHint">Здесь появятся карточки после генерации.</p>

<footer class="dev-footer">
  <a href="https://github.com/твой-username" target="_blank" rel="noopener">

    </svg>
    Разработчик на GitHub
  </a>
</footer>

<script src="/static/script.js?v=4"></script>
</body>
</html>
