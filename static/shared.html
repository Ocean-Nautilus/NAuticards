<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Набор карточек — Conspector</title>
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="light dark" />
<link rel="stylesheet" href="/static/style.css?v=11" />
</head>
<body>
<div class="wrap">

  <header class="site-head">
    <a class="brand" href="/">Conspector</a>
    <h1 id="setTitle">Загружаю набор…</h1>
    <p class="lead">Кто-то поделился с тобой набором карточек. Нажми на карточку, чтобы увидеть ответ.</p>
  </header>

  <main>
    <p class="status" id="status" role="status"></p>

    <div class="actions" id="downloadBox" hidden>
      <button type="button" class="btn" id="downloadBtn">Скачать .txt</button>
      <a class="btn" href="/">Загрузить свою лекцию</a>
    </div>

    <div id="cards"></div>
    <p class="empty" id="emptyHint" hidden>Набор не найден — возможно, ссылка устарела.</p>
  </main>

  <footer class="foot">
    <a href="/">Создать свой набор карточек →</a>
  </footer>

</div>
<script src="/static/common.js?v=11"></script>
<script>
  let cards = [];

  fetch(`/api/set/${encodeURIComponent(location.pathname.split("/").pop())}`)
    .then((res) => {
      if (!res.ok) throw new Error();
      return res.json();
    })
    .then((data) => {
      cards = data.cards;
      $("setTitle").textContent = data.title || "Набор карточек";
      document.title = `${data.title || "Набор карточек"} — Conspector`;
      renderCards(cards);
      $("downloadBox").hidden = false;
    })
    .catch(() => {
      $("setTitle").textContent = "Набор не найден";
      $("emptyHint").hidden = false;
    });

  $("downloadBtn").addEventListener("click", () => downloadCardsAsText(cards));
</script>
</body>
</html>
